<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>

    // TODO
    // - add status codes below
    // - connect message objects to populate here

    const handleResponse = async (response, parseResponse) => {
      const content = document.querySelector('#content');

      switch (response.status) {
        case 200:
          content.innerHTML = `<b>Success</b>`;
          break;
        case 400:
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        case 401:
          content.innerHTML = `<b>Unauthorized</b>`;
          break;
        case 403:
          content.innerHTML = `<b>Forbidden</b>`;
          break;
        case 404:
          content.innerHTML = `<b>Resource Not Found</b>`;
          break;
        case 500:
          content.innerHTML = `<b>Internal Server Error</b>`;
          break;
        case 501:
          content.innerHTML = `<b>Not Implemented</b>`;
          break;
        default:
          content.innerHTML = `Error code not implemented by client.`;
          break;
      }

      // if we're told to parse the response
      if (parseResponse) {
        // check content type
        const contentType = response.headers.get('content-type');

        if (contentType && contentType.includes('xml')) { //if exists and xml
          const text = await response.text();
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(text, 'text/xml');
          const message = xmlDoc.querySelector('message')?.textContent;
          content.innerHTML += `<p>${message}</p>`;
        } else { //otherwise handle JSON
          const object = await response.json();
          content.innerHTML += `<p>${JSON.stringify(object.message).replace(/^"|"$/g, '')}</p>`;
        }
      } else {
        content.innerHTML += `<p>Metadata Received. Content Not Received</p>`;
      }
    };

    const requestUpdate = async (userForm) => {
      const page = userForm.querySelector('#page').value;
      const type = userForm.querySelector('#type').value;

      console.log("page", page);
      console.log("type", type);

      const response = await fetch(page, {
        method: 'GET',
        headers: {
          'Accept': type
        }
      });

      handleResponse(response, true);
      // pass the parseResponse a 'true' so we send the message metadata
    };


    const init = () => {
      const userForm = document.querySelector('#top');
      const button = document.querySelector('#send');

      // call to check results of form and prevent default (dont reload page)
      const updateUserForm = (e) => {
        e.preventDefault();
        requestUpdate(userForm);
        return false;
      }

      button.addEventListener('click', updateUserForm);
    };

    window.onload = init;



  </script>
</head>

<body>
  <section id="top">
    <h3>Status Code Tests</h3>
    <select id="page">
      <option value="/success">Success</option>
      <option value="/badRequest">Bad Request</option>
      <option value="/unauthorized">Unauthorized</option>
      <option value="/forbidden">Forbidden</option>
      <option value="/internal">Internal</option>
      <option value="/notImplemented">Not Implemented</option>
      <option value="/notFound">Not Found</option>
    </select>
    <select id="type">
      <option value="application/json">JSON</option>
      <option value="text/xml">XML</option>
    </select>
    <button id="send">Send</button>
  </section>
  <section id="content">

  </section>
</body>

</html>
